name: AP-X Monitor Watchdog
on:
  schedule:
    - cron: '17 1 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apx-external-health
  cancel-in-progress: false
jobs:
  deadman:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - name: Verify that the primary monitor ran today
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 apx_monitor.py --watchdog --write-state
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apx-watchdog
          path: apx-monitor-result.json
          retention-days: 14
