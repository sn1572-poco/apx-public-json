name: Publish FORMAL dashboard and lightweight JSON
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Generate only from FORMAL ranking
        id: formal
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from generate_lightweight import build_site
          result = build_site(Path('.'), Path('_site'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('publish=' + ('true' if result['status'] == 'FORMAL' else 'false') + '\n')
          print(result)
          PY
      - uses: actions/configure-pages@v5
        if: steps.formal.outputs.publish == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.formal.outputs.publish == 'true'
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        if: steps.formal.outputs.publish == 'true'
        id: deployment
